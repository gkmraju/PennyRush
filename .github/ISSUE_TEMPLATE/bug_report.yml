name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Use fake financial data only.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: The dashboard total updates incorrectly after importing a CSV.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web
        - Android
        - Supabase or database
        - Edge Functions or AI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps using fake data.
      placeholder: |
        1. Open...
        2. Import...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome 125, Android 15, Node 22, etc.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include real statements, receipts, account numbers, API keys, auth tokens, or personal financial data.
          required: true
